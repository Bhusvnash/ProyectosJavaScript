<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Document</title>
		<link rel="stylesheet" href="./assetes/Css/bootstrap.min.css" />
		<link rel="stylesheet" href="./assetes/Css/style.css" />
	</head>
	<body>
		<header class="border-bottom border-2 border-dark">
			<div class="container">
				<div class="row">
					<div class="col-12">
						<h1 class="text-center display-1 primary">Carculadoras</h1>
					</div>
					<div class="col-12">
						<nav class="nav justify-content-center">
							<a class="nav-link" href="./index.html">Carculadora cientifica</a>
							<a class="nav-link" href="./temperatura.html"
								>conversor de temperaturas</a
							>
							<a class="nav-link" href="./imc.html"> Indice de Masa Corporal</a>
						</nav>
					</div>
				</div>
			</div>
		</header>
		<main>
			<div class="container">
				<div class="h1 text-center">carculadora cientifica</div>
				<div
					class="row operaciones justify-content-center align-items-center g-2"
				>
					<div class="col-5">
						<input
							type="text"
							class="form-control text-end"
							readonly
							id="entrada"
							placeholder="0"
						/>
					</div>
					<!--BTN operaciones avanzadas-->
					<div class="col-12 contenedorOp">
						<div
							class="contenedorOp row justify-content-center align-items-center g-2"
						>
							<div class="col">
								<div class="operaciones d-flex">
									<button
										type="button"
										onclick="numero('sen(')"
										class="m-1 btn btn-primary"
									>
										Sen
									</button>
									<button
										type="button"
										onclick="numero('cos(')"
										class="m-1 btn btn-primary"
									>
										Cos
									</button>
									<button
										type="button"
										onclick="numero('tan(')"
										class="m-1 btn btn-primary"
									>
										Tan
									</button>
									<button
										type="button"
										onclick="numero('(')"
										class="m-1 btn btn-primary"
									>
										(
									</button>
									<!---->
									<button
										type="button"
										onclick="numero(1)"
										class="btn btn-primary m-1"
									>
										1
									</button>
									<button
										type="button"
										onclick="numero(2)"
										class="btn btn-primary m-1"
									>
										2
									</button>
									<button
										type="button"
										onclick="numero(3)"
										class="btn btn-primary m-1"
									>
										3
									</button>
									<button
										type="button"
										onclick="numero('+')"
										class="btn btn-primary m-1"
									>
										+
									</button>
								</div>
								<div class="operaciones d-flex">
									<button
										type="button"
										id="potencia"
										onclick="csc()"
										class="m-1 btn potencia btn-primary"
									>
										Csc
									</button>
									<button
										type="button"
										onclick="sec()"
										class="m-1 btn btn-primary"
									>
										Sec
									</button>
									<button
										type="button"
										onclick="ctg()"
										class="m-1 btn btn-primary"
									>
										Ctg
									</button>
									<button
										type="button"
										onclick="numero(')')"
										class="m-1 btn btn-primary"
									>
										)
									</button>
									<!---->
									<button
										type="button"
										onclick="numero(4)"
										class="btn btn-primary m-1"
									>
										4
									</button>
									<button
										type="button"
										onclick="numero(5)"
										class="btn btn-primary m-1"
									>
										5
									</button>
									<button
										type="button"
										onclick="numero(6)"
										class="btn btn-primary m-1"
									>
										6
									</button>
									<button
										type="button"
										onclick="numero('-')"
										class="btn btn-primary m-1"
									>
										-
									</button>
								</div>
								<div class="operaciones d-flex">
									<button
										type="button"
										onclick="pi()"
										class="m-1 btn btn-primary"
									>
										π
									</button>
									<button
										type="button"
										onclick="euler()"
										class="m-1 btn btn-primary"
									>
										e
									</button>
									<button
										type="button"
										onclick="raizCuadrada()"
										class="m-1 btn btn-primary"
									>
										√
									</button>
									<button
										type="button"
										onclick="raizCubica()"
										class="m-1 btn btn-primary"
									>
										∛
									</button>
									<button
										type="button"
										onclick="factorial()"
										class="m-1 btn btn-primary"
									>
										n!
									</button>
									<button
										type="button"
										onclick="random()"
										class="m-1 btn btn-primary"
									>
										ran
									</button>
									<!---->
									<button
										type="button"
										onclick="numero(7)"
										class="btn btn-primary m-1"
									>
										7
									</button>
									<button
										type="button"
										onclick="numero(8)"
										class="btn btn-primary m-1"
									>
										8
									</button>
									<button
										type="button"
										onclick="numero(9)"
										class="btn btn-primary m-1"
									>
										9
									</button>
									<button
										type="button"
										onclick="numero('x')"
										class="btn btn-primary m-1"
									>
										x
									</button>
								</div>
								<div class="d-flex operaciones">
									<button
										type="button"
										onclick="log10()"
										class="m-1 btn btn-primary"
									>
										Log(x)
									</button>
									<button
										type="button"
										onclick="absoluto()"
										class="m-1 btn btn-primary"
									>
										|n|
									</button>
									<button
										type="button"
										onclick="raizCuadrada()"
										class="m-1 btn btn-primary"
									>
										.
									</button>
									<button
										type="button"
										onclick="CE()"
										class="m-1 btn btn-primary ce"
									>
										CE
									</button>
									<!---->
									<button
										type="button"
										onclick="limpiar()"
										class="btn btn-primary m-1"
									>
										←
									</button>
									<button
										type="button"
										onclick="numero(0)"
										class="btn btn-primary m-1"
									>
										0
									</button>
									<button
										type="button"
										onclick="carcular()"
										class="btn btn-primary m-1"
									>
										=
									</button>
									<button
										type="button"
										onclick="numero('/')"
										class="btn btn-primary m-1"
									>
										/
									</button>
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>
		</main>
		<footer class="mt-5 border-top border-2 border-dark">
			<div class="container">
				<div class="row">
					<div class="col-12 text-center">
						<p class="mb-1">
							<b>Dunamer Beharry</b>
						</p>
						<p class="mb-0">
							<a
								href="mailto:beharrysantoyo@gmail.com"
								class="text-decoration-none text-muted"
							>
								beharrysantoyo@gmail.com
							</a>
						</p>
					</div>
				</div>
			</div>
		</footer>
		<script src="./assetes/Js/funciones.js"></script>
		<script src="./assetes/Js/bootstrap.bundle.min.js"></script>
	</body>
</html>
