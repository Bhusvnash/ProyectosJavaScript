<!doctype html>
<html lang="es" data-bs-theme="dark">
  <head>
    <title>pokemon</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="stylesheet" href="../../Boostrap/bootstrap.min.css" />
  </head>

  <body>
    <header class="container row justify-content-center align-items-center">
      <div class="col-8 justify-content-center">
        <h1 class="card-title m-5 border-2 justify-content-center text-center">
          inicio
        </h1>
      </div>
    </header>
    <main class="container row-cols-auto justify-content-center">
      <div class="col-8 justify-content-center">
        <div class="card mb-3" style="max-width: 540px">
          <div class="row g-0">
            <div class="col-md-8">
              <div class="card-body">
                <h5 class="card-title text-center mb-3">Registro</h5>
                <input
                  type="text"
                  class="form-control"
                  name="formId1"
                  id="txtNombre"
                  placeholder="Nombre"
                />
                <input
                  type="text"
                  class="mt-3 form-control"
                  name="formId2"
                  id="txtApellido"
                  placeholder="Apellido"
                />
                <input
                  type="number"
                  class="mt-3 form-control"
                  name="formId3"
                  id="txtEdad"
                  placeholder="Edad"
                />
                <div class="mt-3" id="AddTxtSaldo"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <!--<input
            type="text"
            class="form-control"
            name="formId1"
            id="formId1"
            placeholder=""
          /> -->
    </main>
    <script src="../../Boostrap/bootstrap.bundle.min.js"></script>
    <script src="./js/app.js"></script>
  </body>
</html>
